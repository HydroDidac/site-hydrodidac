backend:
  name: github
  repo: ton-compte-github/site-hydrodidac # ⚠️ à remplacer par ton vrai dépôt GitHub
  branch: main
  base_url: https://hydrodidac-cms-auth.<ton-sous-domaine>.workers.dev # ⚠️ URL du Worker d'authentification (voir README de déploiement)

site_url: https://hydrodidac.com

media_folder: "public/assets/fiches"
public_folder: "/assets/fiches"

collections:
  - name: "fiches"
    label: "Fiches didactiques"
    folder: "src/content/fiches"
    create: true
    slug: "{{fields.code}}-{{slug}}"
    fields:
      - { label: "Code fiche", name: "code", widget: "string", hint: "Ex: F012" }
      - { label: "Titre", name: "titre", widget: "string" }
      - label: "Niveau"
        name: "niveau"
        widget: "select"
        options:
          - { label: "🟢 Débutant", value: "debutant" }
          - { label: "🟠 Intermédiaire", value: "intermediaire" }
          - { label: "🔴 Avancé", value: "avance" }
      - { label: "Module", name: "module", widget: "string" }
      - { label: "Résumé", name: "resume", widget: "text" }
      - { label: "Temps de lecture (min)", name: "tempsLecture", widget: "number", required: false }
      - { label: "Fiches liées (codes)", name: "ficheLiees", widget: "list", required: false }
      - { label: "Date de publication", name: "datePublication", widget: "datetime" }
      - { label: "Contenu", name: "body", widget: "markdown" }
